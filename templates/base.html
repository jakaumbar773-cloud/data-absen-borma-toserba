<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Data Absen - Borma Toserba</title>
  <style>
    :root{
      --bg1: #fff7e6;
      --yellow: #FFC107;
      --orange: #FF9100;
      --accent: linear-gradient(90deg,var(--yellow),var(--orange));
      --text: #2b2b2b;
      --card: #ffffff;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
    }
    body{
      margin:0;
      background: var(--bg1);
      color:var(--text);
    }
    header{
      background: var(--accent);
      padding:16px 24px;
      display:flex;
      align-items:center;
      gap:16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    header img.logo{ height:48px; width:auto; display:block; }
    header h1{ font-size:20px; margin:0; color:#2b2b2b; letter-spacing:0.2px; }
    main{ padding:24px; max-width:1100px; margin:20px auto; }
    .card{ background:var(--card); padding:18px; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,0.06);}
    .form-row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
    label{ font-size:14px; margin-bottom:6px; display:block; color:#444; }
    select,input[type="date"],input[type="number"]{ padding:8px 10px; border-radius:6px; border:1px solid #e6d9c4; min-width:180px; }
    button{ padding:10px 14px; border-radius:8px; border:0; cursor:pointer; font-weight:600; }
    .btn-ok{ background: #2b8a3e; color:white; }
    .btn-print{ background: #FF9100; color:white; }
    table{ width:100%; border-collapse:collapse; margin-top:12px; }
    th,td{ text-align:left; padding:8px 10px; border-bottom:1px solid #f0e6d1; }
    .meta{ margin-top:8px; color:#666; font-size:14px; }
    @media (max-width:700px){
      .form-row{ flex-direction:column; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <img src="{{ url_for('static', filename='logo.svg') }}" alt="Borma Toserba" class="logo" />
    <div>
      <h1>Data Absen - Head Office</h1>
      <div style="font-size:13px;color:#2b2b2b;opacity:0.9">Borma Toserba</div>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <script>
    // Print button JS
    function doPrint(){
      window.print();
    }
  </script>
</body>
</html>
